# Builds the Linux AppImage and attaches it to a GitHub release. Runs on its own when a release is
# published (scripts/release.mjs, from Windows), or by hand for an existing tag.
#
# Ubuntu 22.04 on purpose: an AppImage only runs on systems with the same or newer glibc as the
# machine that built it, so building on an older distro makes it run nearly everywhere.
#
# Built-in logins (YouTube, Kick, alerts) need the repo secret ENV_LOCAL: the full text of your
# .env.local (Settings → Secrets and variables → Actions). Without it the AppImage still works,
# people just have to bring their own client IDs, like a build without .env.local.
name: Linux release

on:
  release:
    types: [published]
  # TEMPORARY: test builds of the Linux port before it's merged. Each push to linux-port builds the
  # AppImage and keeps it as a workflow artifact (nothing gets attached to a release). Remove this
  # trigger when merging to main.
  push:
    branches: [linux-port]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach to (e.g. v0.5.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: linux-release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  # a newer push replaces a test build that's still running; release builds always finish
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - name: Built-in logins
        env:
          ENV_LOCAL: ${{ secrets.ENV_LOCAL }}
        run: |
          if [ -z "$ENV_LOCAL" ]; then echo "::warning::No ENV_LOCAL secret: built-in logins are left out."; exit 0; fi
          # GitHub hides a multi-line secret unreliably, and a failing build script prints its
          # cargo:rustc-env lines, so hide every value on its own before anything else runs
          printf '%s\n' "$ENV_LOCAL" | tr -d '\r' | while IFS='=' read -r key value; do
            value=$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
            [ -n "$value" ] && echo "::add-mask::$value"
          done
          printf '%s\n' "$ENV_LOCAL" > .env.local
      - name: Check versions match the tag
        if: env.TAG != ''
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$TAG" ] || { echo "::error::package.json says $v, tag is $TAG"; exit 1; }
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build the AppImage
        run: node scripts/build.mjs
      - name: Name it and check it for local paths
        run: |
          v=${TAG#v}
          # test builds: package version plus the commit
          [ -n "$v" ] || v="$(node -p "require('./package.json').version")-${GITHUB_SHA::7}"
          src=$(ls core/target/release/bundle/appimage/*.AppImage | head -1)
          out="Multichat-Control-$v-x86_64.AppImage"
          mv "$src" "$out"
          chmod +x "$out"
          # the AppImage itself is compressed, so check the folder it was made from
          appdir=$(ls -d core/target/release/bundle/appimage/*.AppDir | head -1)
          grep -a -q "nnfisfree/multichat-control" "$appdir"/usr/bin/* || { echo "::error::Audit can't read the binary"; exit 1; }
          if grep -r -a -l -e "$HOME" -e "$GITHUB_WORKSPACE" "$appdir"; then echo "::error::The AppImage contains a path from the build machine"; exit 1; fi
          rm -f .env.local
          ls -la "$out"
          echo "APPIMAGE_FILE=$out" >> "$GITHUB_ENV"
      - name: Keep the test build
        if: env.TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APPIMAGE_FILE }}
          path: ${{ env.APPIMAGE_FILE }}
          retention-days: 14
          # an AppImage is already compressed
          compression-level: 0
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$APPIMAGE_FILE" --clobber
