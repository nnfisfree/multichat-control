# Keeps the Wall of Supporters (shared/supporters.json) in sync with GitHub Sponsors. Buy Me a Coffee
# is left out on purpose (it's the stream's own tip jar). Needs the repo secret SPONSORS_TOKEN
# (Settings → Secrets and variables → Actions): a classic personal access token of nnfisfree with the
# read:user and read:org scopes.
name: Update supporters

on:
  schedule:
    - cron: '*/30 * * * *'
  # "Run workflow" button, to refresh right after a donation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supporters
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read sponsors from GitHub
        run: node scripts/update-supporters.mjs
        env:
          SPONSORS_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
      - name: Commit the list if it changed
        run: |
          if git diff --quiet -- shared/supporters.json; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add shared/supporters.json
          git commit -m "Update the supporters list"
          git push
