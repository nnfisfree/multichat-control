# Keeps the Wall of Supporters (shared/supporters.json) in sync with Buy Me a Coffee.
# Needs the repo secret BMC_TOKEN: a Personal Access Token from https://developers.buymeacoffee.com
# (Settings → Secrets and variables → Actions → New repository secret).
name: Update supporters

on:
  schedule:
    - cron: '*/30 * * * *'
  # "Run workflow" button, to refresh right after a donation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supporters
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read supporters from Buy Me a Coffee
        run: node scripts/update-supporters.mjs
        env:
          BMC_TOKEN: ${{ secrets.BMC_TOKEN }}
      - name: Commit the list if it changed
        run: |
          if git diff --quiet -- shared/supporters.json; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add shared/supporters.json
          git commit -m "Update the supporters list"
          git push
