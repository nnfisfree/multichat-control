appId: app.nnfmultichat.desktop
productName: "NoName's Multichat Control"
executableName: NoNames-Multichat-Control
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: resources/proto
    to: proto
  - from: resources/icon.png
    to: icon.png
win:
  target:
    - portable
    - zip
  icon: resources/icon.png
  artifactName: NoNames-Multichat-Control-${version}-${arch}.${ext}
portable:
  artifactName: NoNames-Multichat-Control-${version}-portable.exe
