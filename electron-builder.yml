appId: app.nnfmultichat.desktop
productName: "NoNameFound's Multichat Stream"
executableName: NoNameFounds-Multichat-Stream
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: resources/proto
    to: proto
  - from: resources/icon.png
    to: icon.png
win:
  target:
    - portable
    - zip
  icon: resources/icon.png
  artifactName: NoNameFounds-Multichat-Stream-${version}-${arch}.${ext}
portable:
  artifactName: NoNameFounds-Multichat-Stream-${version}-portable.exe
