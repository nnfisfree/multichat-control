appId: app.nnfmultichat.desktop
productName: "NoName's Multichat Control"
executableName: Multichat-Control
directories:
  output: release
# Only the built app. Anything else under out/ must never ship.
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
extraResources:
  - from: resources/proto
    to: proto
  - from: resources/icon.png
    to: icon.png
win:
  target:
    - portable
    - zip
  icon: resources/icon.png
  artifactName: Multichat-Control-${version}-${arch}.${ext}
portable:
  artifactName: Multichat-Control-${version}-portable.exe
